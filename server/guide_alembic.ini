# Alembic config for the PUBLIC GUIDE database only (GUIDE_DATABASE_URL).
# The platform schema is still managed by create_tables.py; this file never touches it.
#   venv/Scripts/python -m alembic -c guide_alembic.ini upgrade head
[alembic]
script_location = app/guide/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
