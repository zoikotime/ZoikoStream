# Operator Guide tests run on their own, against OPGUIDE_TEST_DATABASE_URL only:
#   cd server/operator_guide_tests && ../venv/Scripts/python -m pytest
# confcutdir stops pytest loading server/conftest.py; this suite has its own, equally strict
# database guard (conftest.py) and its own dedicated database.
[pytest]
pythonpath = ..
testpaths = .
addopts = -q -p no:cacheprovider --confcutdir=.
filterwarnings =
    ignore::DeprecationWarning
