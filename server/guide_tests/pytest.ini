# Guide tests run on their own, against GUIDE_TEST_DATABASE_URL only:
#   cd server/guide_tests && ../venv/Scripts/python -m pytest
# confcutdir stops pytest loading server/conftest.py (the platform suite's DB guard), which
# would otherwise demand TEST_DATABASE_URL for tests that never touch the platform database.
[pytest]
pythonpath = ..
testpaths = .
addopts = -q -p no:cacheprovider --confcutdir=.
filterwarnings =
    ignore::DeprecationWarning
