openapi: 3.1.0
info:
  title: ZoikoStream Public Guide API
  version: 1.0.0
  description: Public, anonymous ZoikoStream Guide API (ZST-API-PUB-GUIDE-001 v1.0). The browser holds
    an opaque HttpOnly session capability cookie (zs_guide_sid) plus a per-session CSRF token sent as
    X-ZS-CSRF on every mutating session route; there is no static client API key. Errors are RFC 9457
    problem details with stable codes. Generated from the application by `python -m app.guide.openapi.export`;
    do not edit by hand.
paths:
  /bootstrap:
    get:
      tags:
      - bootstrap
      summary: Bootstrap
      description: 'Public presentation config. Creates NO session, cookie, record or profile

        (API §6 "NO SILENT SESSION", API-AT-01).


        Kill switch: answers 200 with `enabled: false` plus the direct routes, not 503. API §6

        makes bootstrap the call that "determines whether Guide is enabled", and PR-041 needs

        the direct routes in that answer; App. A''s 503 remains for a failure to answer at all.'
      operationId: getBootstrap
      parameters:
      - name: page_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_-]*$
          default: home
          title: Page Id
      - name: page_type
        in: query
        required: false
        schema:
          enum:
          - home
          - product
          - solutions
          - pricing
          - help
          - viewer
          - event
          - contact
          - trust
          - privacy
          - status
          - developer
          - other
          type: string
          default: home
          title: Page Type
      - name: locale
        in: query
        required: false
        schema:
          type: string
          maxLength: 16
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
          default: en-US
          title: Locale
      responses:
        '200':
          description: Public presentation config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
              examples:
                enabled:
                  value:
                    api_version: '1.0'
                    assistant:
                      name: Guide
                      descriptor: Public AI Assistant
                    enabled: true
                    locale: en-US
                    welcome: Welcome to ZoikoStream Guide. I can help with product questions, pricing
                      and demos, or viewer support.
                    suggested_intents:
                    - intent_id: I-PRICING
                      label: Pricing & plans
                      priority: 10
                    - intent_id: I-DEMO
                      label: Request a demo
                      priority: 9
                    limits:
                      max_message_chars: 4000
                      max_concurrent_requests: 1
                    privacy:
                      privacy_notice_href: /privacy
                      terms_href: /trust
                    direct_routes:
                    - action_id: help-center
                      type: open_help
                      label: Contact ZoikoStream
                      href: /contact
                    - action_id: status-page
                      type: open_status
                      label: Service status
                      href: /status
                kill_switch:
                  summary: Guide disabled
                  value:
                    api_version: '1.0'
                    assistant:
                      name: Guide
                      descriptor: Public AI Assistant
                    enabled: false
                    locale: en-US
                    suggested_intents: []
                    limits:
                      max_message_chars: 4000
                      max_concurrent_requests: 1
                    privacy:
                      privacy_notice_href: /privacy
                      terms_href: /trust
                    direct_routes:
                    - action_id: help-center
                      type: open_help
                      label: Contact ZoikoStream
                      href: /contact
                    - action_id: status-page
                      type: open_status
                      label: Service status
                      href: /status
                    unavailable_reason: disabled
        '304':
          description: Not modified (If-None-Match matched the ETag).
        '400':
          description: GUIDE_BAD_REQUEST
          content:
            application/problem+json:
              examples:
                GUIDE_BAD_REQUEST:
                  summary: Malformed request
                  value:
                    type: /problems/bad-request
                    title: Malformed request
                    status: 400
                    detail: The request does not match the expected schema.
                    code: GUIDE_BAD_REQUEST
                    request_id: req_5f2a9c0d1e3b4a6f7c8d9e0a
                    correlation_id: cor_1a2b3c4d5e6f7a8b9c0d1e2f
                    retryable: false
              schema: &id001
                $ref: '#/components/schemas/Problem'
        '429':
          description: GUIDE_RATE_LIMITED
          content:
            application/problem+json:
              examples:
                GUIDE_RATE_LIMITED:
                  summary: Too many requests
                  value:
                    type: /problems/rate-limited
                    title: Too many requests
                    status: 429
                    detail: Too many requests.
                    code: GUIDE_RATE_LIMITED
                    request_id: req_5f2a9c0d1e3b4a6f7c8d9e0a
                    correlation_id: cor_1a2b3c4d5e6f7a8b9c0d1e2f
                    retryable: true
              schema: *id001
        '503':
          description: GUIDE_UNAVAILABLE
          content:
            application/problem+json:
              examples:
                GUIDE_UNAVAILABLE:
                  summary: Guide is temporarily unavailable
                  value:
                    type: /problems/unavailable
                    title: Guide is temporarily unavailable
                    status: 503
                    detail: Guide is unavailable right now. You can still use the Help Center, status
                      page, or contact support directly.
                    code: GUIDE_UNAVAILABLE
                    request_id: req_5f2a9c0d1e3b4a6f7c8d9e0a
                    correlation_id: cor_1a2b3c4d5e6f7a8b9c0d1e2f
                    retryable: true
              schema: *id001
        '422':
          description: GUIDE_VALIDATION_ERROR
          content:
            application/problem+json:
              schema: *id001
              examples:
                GUIDE_VALIDATION_ERROR:
                  summary: Request validation failed
                  value:
                    type: /problems/validation-error
                    title: Request validation failed
                    status: 422
                    detail: One or more submitted fields are invalid.
                    code: GUIDE_VALIDATION_ERROR
                    request_id: req_5f2a9c0d1e3b4a6f7c8d9e0a
                    correlation_id: cor_1a2b3c4d5e6f7a8b9c0d1e2f
                    retryable: false
                    field_errors:
                    - field: page_id
                      code: string_pattern_mismatch
                      message: Value is invalid.
