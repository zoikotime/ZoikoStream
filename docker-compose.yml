# Local run: mirrors the two Cloud Run services. Prod uses the same Dockerfiles.
services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    env_file: .env

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:8080"
