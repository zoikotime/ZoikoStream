name: Deploy

# main only. A feature branch cannot reach this workflow at all — the trigger is the first
# of three independent reasons a feature branch can never deploy production (the others are
# the `if` on the deploy job and the branch check inside it).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One production deployment at a time, and NEVER cancelled mid-flight. `cancel-in-progress:
# false` is the important half: killing a run between "image pushed" and "revision serving"
# leaves the service in a state nobody chose, so a second commit waits its turn instead.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── the gate ────────────────────────────────────────────────────────────────────────────
  #
  # Reported as its own job so the answer is visible in the run summary rather than hidden in
  # a skipped job's condition. Until `GITHUB_CD_ENABLED` is set to 'true' this workflow tests
  # main and deploys nothing, which is exactly what is wanted while the external Cloud Build
  # trigger still owns production: two mechanisms deploying the same commit is worse than one
  # deploying it late.
  gate:
    name: Deployment gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CD_ENABLED: ${{ vars.GITHUB_CD_ENABLED }}
        run: |
          if [ "$CD_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "### Production deployment ENABLED" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Actions is the canonical CD owner for this commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Production deployment disabled"
              echo ""
              echo "Repository variable \`GITHUB_CD_ENABLED\` is \`${CD_ENABLED:-unset}\` (needs \`true\`)."
              echo ""
              echo "CI still ran against this commit. Nothing was deployed."
              echo ""
              echo "Before enabling: disable the external Cloud Build / \"Continuously deploy\""
              echo "trigger on the \`zoikostream-git\` service, or the same commit deploys twice."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── validation ──────────────────────────────────────────────────────────────────────────
  #
  # The whole of ci.yml, reused rather than reimplemented. Two consequences worth naming:
  #
  #   * There is exactly ONE set of CI jobs per main push. ci.yml's own push trigger ignores
  #     main precisely so this call is not racing a duplicate run of itself.
  #   * `tests fail -> no deployment` is structural, not a convention: the deploy job below
  #     `needs: validate`, so a failed job here means the deploy job never starts. There is no
  #     continue-on-error and no `always()` anywhere in this file.
  #
  # Chosen over the `workflow_run` pattern deliberately: workflow_run resolves its workflow
  # file from the default branch, reports into a separate run that never appears on the
  # commit's own checks, and needs head_sha plumbing to deploy the right thing. A direct
  # `uses:` keeps one run, one commit, one answer.
  validate:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ── deployment ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [gate, validate]
    if: needs.gate.outputs.enabled == 'true'
    environment: production
    permissions:
      contents: read
      # The ONLY place this repository requests an OIDC token. It is what lets
      # google-github-actions/auth exchange a short-lived GitHub identity for Google
      # credentials, which is why no service-account JSON key needs to exist in GitHub.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Belt and braces. The `on:` trigger already restricts this workflow to main, but
      # workflow_dispatch can be aimed at any ref from the Actions UI, and a production deploy
      # is not the place to rely on one check.
      - name: Refuse any ref that is not main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::refusing to deploy ${{ github.ref }} — production deploys from main only"
            exit 1
          fi

      # Fail before touching Google if the deployment inputs are not configured, rather than
      # producing a confusing auth error three steps later.
      - name: Check deployment configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for name in PROJECT_ID REGION SERVICE REPOSITORY WIF_PROVIDER SERVICE_ACCOUNT; do
            eval "value=\$$name"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository variables:$missing"
            exit 1
          fi

      # Workload Identity Federation. No long-lived JSON key is stored, referenced or minted.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      # ONE image, from the existing Dockerfile — FastAPI plus the built SPA on a single
      # origin. The old (deleted) workflow built two images for two services; that
      # architecture is gone and is not being revived.
      #
      # Tagged with the commit SHA rather than `latest` so a revision can be traced back to a
      # commit, and so a rollback names something immutable.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/zoikostream:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── the deploy, and what it deliberately does NOT do ────────────────────────────────
      #
      # `--image` and nothing else. No --set-env-vars, no --update-env-vars, no --set-secrets,
      # no --clear-env-vars. `gcloud run deploy --image` on an EXISTING service creates a new
      # revision that inherits the current configuration — env vars, Secret Manager bindings,
      # CPU/memory, concurrency, scaling, service account, ingress — and changes only the
      # container.
      #
      # This is the point of the whole design. The service already carries production
      # configuration (DATABASE_URL, SECRET_KEY, REDIS_URL, LIVEKIT_API_SECRET,
      # RESEND_API_KEY, STRIPE_SECRET_KEY, GCS credentials). None of those values exist in
      # GitHub, none are passed on a command line, and none can be printed by a workflow log.
      # A deployment here is an IMAGE change; changing runtime configuration stays a
      # deliberate, separate act performed against Cloud Run directly.
      - name: Deploy the revision
        id: deploy
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/zoikostream:${{ github.sha }}" \
            --quiet
          url=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          revision=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format='value(status.latestReadyRevisionName)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # GET /health — a real endpoint (app/main.py: `@app.get("/health")` returning
      # {"status": "ok"}), not an invented one. Unauthenticated and side-effect free, so it is
      # safe to call from CI.
      #
      # Retried because a fresh revision can take a few seconds to start serving; a failure
      # after that window fails the JOB, so a deploy that produced a revision which cannot
      # answer is visibly red rather than quietly green.
      - name: Smoke check
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 "$URL/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health: $code $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt $attempt: $code — retrying"
            sleep 10
          done
          echo "::error::$URL/health did not return 200 after the new revision went live"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Service | \`${{ vars.CLOUD_RUN_SERVICE }}\` |"
            echo "| Region | \`${{ vars.GCP_REGION }}\` |"
            echo "| Revision | \`${{ steps.deploy.outputs.revision }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo ""
            echo "Runtime configuration was inherited from the previous revision — this"
            echo "deployment changed the container image only."
          } >> "$GITHUB_STEP_SUMMARY"
