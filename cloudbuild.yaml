# Deployment-time schema gate for ZoikoStream.
#
# WHY THIS FILE EXISTS
# --------------------
# Nothing in the current pipeline applies database schema. The Dockerfile installs
# requirements and runs uvicorn; app/main.py deliberately refuses to migrate on boot ("schema
# is applied by `python create_tables.py`, not on startup — an app boot should not be able to
# mutate the database"); and the Cloud Build trigger is configured in the GCP console with no
# in-repo config. So every schema-bearing commit shipped code that outran the database until a
# human remembered to run the script by hand. That is how the live database ended up missing
# 63 tables and 60 columns that create_tables.py had statements for all along — surfacing in
# Cloud Run as `psycopg2.errors.UndefinedColumn` on subscriptions.stripe_customer_id,
# events.approved_notified_at and support_access_requests.review_due_at.
#
# This does NOT introduce a second migration system. It runs the project's existing
# `server/create_tables.py` — the same command, the same idempotent statements — as a build
# step, and makes the deploy conditional on it succeeding.
#
# HOW THE GATE WORKS
# ------------------
# Cloud Build runs steps sequentially and aborts the build on the first non-zero step, so
# placing `migrate` before `deploy` is the entire mechanism: if the schema cannot be applied,
# the new revision is never rolled out. ensure_schema() was hardened to make that reliable —
# it applies one statement per transaction with a bounded lock_timeout and retry, collects
# failures, prints each one, and raises RuntimeError rather than printing "Schema ready!".
# Verified both failure modes exit non-zero:
#   * a statement that cannot succeed  -> exit 1, failure listed, no success line
#   * an unreachable database          -> exit 1
#
# ORDERING NOTE: the schema is applied BEFORE the new revision serves traffic, which is the
# safe direction for this project because every migration here is ADDITIVE (ADD COLUMN IF NOT
# EXISTS / CREATE INDEX IF NOT EXISTS / widening a VARCHAR). Additive changes are invisible to
# the currently-running old revision, so there is no window in which the old code breaks. If a
# genuinely destructive change is ever added to create_tables.py, this ordering stops being
# safe on its own and the change must be split across two deploys (expand, then contract).
#
# MANUAL INFRASTRUCTURE ACTIONS REQUIRED — this file is INERT until they are done:
#   1. Point the Cloud Build trigger at this file: Cloud Build > Triggers > (the trigger whose
#      id appears in Cloud Run logs as gcb-trigger-id) > Edit > Configuration =
#      "Cloud Build configuration file (yaml or json)" > Location = /cloudbuild.yaml.
#      Until this is done the trigger keeps using its console-defined Dockerfile build and
#      NOTHING here takes effect.
#   2. Create the secret holding the production connection string:
#        gcloud secrets create DATABASE_URL --replication-policy=automatic
#        printf '%s' "$CONN_STRING" | gcloud secrets versions add DATABASE_URL --data-file=-
#      (Never commit the value. If a secret of this name already exists, reuse it.)
#   3. Grant the Cloud Build service account access:
#        SA="$(gcloud projects describe zoikostream-504704 --format='value(projectNumber)')@cloudbuild.gserviceaccount.com"
#        gcloud secrets add-iam-policy-binding DATABASE_URL \
#          --member="serviceAccount:$SA" --role=roles/secretmanager.secretAccessor
#        gcloud projects add-iam-policy-binding zoikostream-504704 \
#          --member="serviceAccount:$SA" --role=roles/run.admin
#        gcloud projects add-iam-policy-binding zoikostream-504704 \
#          --member="serviceAccount:$SA" --role=roles/iam.serviceAccountUser
#   4. Limit the trigger to ONE concurrent build (Trigger > Edit > "Concurrency control", or
#      keep queue depth at 1). Two builds running create_tables.py simultaneously can race:
#      Postgres CREATE TABLE IF NOT EXISTS is not atomic against a concurrent identical
#      CREATE, and Base.metadata.create_all() is not concurrency-safe. The _Applier retry
#      covers lock contention and deadlocks, NOT duplicate-object errors — so a race fails the
#      build rather than half-migrating, which is the safe outcome but still a failed deploy.
#   5. Confirm the Cloud Run service's own DATABASE_URL points at the SAME database this step
#      migrates. If they diverge, this gate migrates one database while the app reads another.

substitutions:
  _SERVICE: zoikostream-git
  _REGION: europe-west1
  _IMAGE: gcr.io/$PROJECT_ID/zoikostream

steps:
  # 1. Build once. Every step below uses THIS artifact, so the schema that gets applied and
  #    the code that depends on it are guaranteed to be the same commit — which is the whole
  #    reason the migration runs inside the built image rather than from a checkout.
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:$COMMIT_SHA', '-t', '${_IMAGE}:latest', '.']

  # 2. Push before deploy (Cloud Run pulls from the registry). Deliberately an explicit step
  #    rather than the top-level `images:` key, because `images:` pushes AFTER all steps —
  #    i.e. after the deploy step, which would then have nothing to pull.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']
    waitFor: ['build']

  # 3. THE GATE. A non-zero exit here aborts the build and the deploy step never runs.
  #
  #    `-e DATABASE_URL` with no `=value` makes Docker inherit the variable from this step's
  #    environment, where secretEnv placed it. That is deliberate: writing
  #    `-e DATABASE_URL="$$DATABASE_URL"` would put the connection string into a command line,
  #    and command lines are the thing most likely to end up in a build log.
  - id: migrate
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['DATABASE_URL']
    args:
      - -c
      - |
        set -euo pipefail
        docker run --rm -e DATABASE_URL -w /app/server \
          "${_IMAGE}:$COMMIT_SHA" python create_tables.py
    waitFor: ['build']

  # 4. Deploy only once the schema is in place.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet
    waitFor: ['push', 'migrate']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
